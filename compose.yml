name: lendloop
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env.n8n}
      GENERIC_TIMEZONE: Etc/UTC
      TZ: Etc/UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: internal
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:-}
      CONVEX_TO_N8N_SECRET: ${CONVEX_TO_N8N_SECRET:-}
      N8N_TO_CONVEX_SECRET: ${N8N_TO_CONVEX_SECRET:-}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
volumes:
  n8n_data:
