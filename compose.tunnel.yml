services:
  gateway:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    entrypoint: ["node", "/gateway/webhook-gateway.mjs"]
    environment:
      CONVEX_TO_N8N_SECRET: ${CONVEX_TO_N8N_SECRET:?Missing signing key}
    volumes:
      - ./scripts/webhook-gateway.mjs:/gateway/webhook-gateway.mjs:ro
    depends_on:
      - n8n
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://gateway:5681"]
    depends_on:
      - gateway
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
